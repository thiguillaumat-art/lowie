<!doctype html><html><head><meta charset="utf-8"><link href="/fonts/fonts.css" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}html,body{width:1200px;height:630px;overflow:hidden}
body{background:#fff;color:#121212;display:flex;flex-direction:column;justify-content:space-between;padding:64px 72px;position:relative}
.top{display:flex;align-items:center;font-family:Silkscreen;font-size:30px;line-height:1;letter-spacing:.02em}
.top svg{margin:0 4px;position:relative;top:3px}
h1{font-family:Silkscreen;font-weight:400;font-size:66px;line-height:76px;max-width:760px;letter-spacing:-.01em}
.bot{font-family:"IBM Plex Mono";font-size:24px;color:#6B6B6B}
#big{position:absolute;right:64px;top:50%;transform:translateY(-50%)}
</style></head><body>
<div class="top">L<svg id="s" width="34" height="27" viewBox="0 0 20 16" shape-rendering="crispEdges"></svg>WIE</div>
<h1>A marketing hire for what you ship.</h1>
<div class="bot">getlowie.vercel.app · private beta</div>
<svg id="big" width="300" height="240" viewBox="0 0 20 16" shape-rendering="crispEdges"></svg>
<script>
const r=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#121212"/>`;
const LB=[[4,1,2,1],[3,2,2,4],[2,6,2,1],[1,7,2,2],[2,9,2,1],[3,10,2,4],[4,14,2,1]];
const m=LB.map(([x,y,w,h])=>r(x,y,w,h)).join("")+LB.map(([x,y,w,h])=>r(20-x-w,y,w,h)).join("")+r(7,6,2,3)+r(11,6,2,3);
s.innerHTML=m; big.innerHTML=m;
</script></body></html>
