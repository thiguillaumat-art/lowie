<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lowie — 10 identités</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{--ink:#121212;--muted:#6B6B6B;--lav:#C4B5FD;--lavbg:#EAE4FF;--line:#EEEEEE}
*{box-sizing:border-box;margin:0}
body{background:#fff;color:var(--ink);font-family:Inter,sans-serif;padding:40px}
h1{font-family:Silkscreen;font-weight:400;font-size:28px;margin-bottom:6px}
.lead{color:var(--muted);font-size:15px;margin-bottom:28px}
.grid{display:flex;flex-wrap:wrap;gap:16px}
.card{width:calc(20% - 13px);min-width:230px;border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}
.stage{height:150px;display:flex;align-items:center;justify-content:center;background:#FAFAFA;border-radius:6px}
.sizes{display:flex;align-items:center;gap:14px;font-family:'IBM Plex Mono';font-size:11px;color:var(--muted)}
.sizes .wm{display:flex;align-items:center;gap:7px;font-family:Silkscreen;font-size:16px;color:var(--ink)}
.n{font-family:'IBM Plex Mono';font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
h2{font-size:16px;font-weight:600}
p{font-size:13px;line-height:19px}
p b{font-weight:600}
.risk{color:#8A2B1F}
svg{shape-rendering:crispEdges;overflow:visible}
svg *{transform-box:fill-box;transform-origin:center}
/* animations */
@keyframes blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes look{0%,30%{transform:translateX(0)}40%,60%{transform:translateX(-1px)}70%,90%{transform:translateX(1px)}100%{transform:translateX(0)}}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes nod{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(1px)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(-2px)}80%{transform:translateY(0)}}
@keyframes slide{0%{transform:translateY(3px)}50%{transform:translateY(-3px)}100%{transform:translateY(3px)}}
@keyframes bar1{0%,20%{opacity:.25}30%,100%{opacity:1}}
@keyframes bar2{0%,45%{opacity:.25}55%,100%{opacity:1}}
@keyframes bar3{0%,70%{opacity:.25}80%,100%{opacity:1}}
@keyframes wink{0%,40%{opacity:1}45%,95%{opacity:0}100%{opacity:1}}
@keyframes winkplus{0%,40%{opacity:0}45%,95%{opacity:1}100%{opacity:0}}
@keyframes pop{0%,50%{transform:translateY(0);opacity:0}60%{opacity:1}100%{transform:translateY(-4px);opacity:0}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes squash{0%,80%,100%{transform:scaleX(1)}88%{transform:scaleX(1.15)}}
@keyframes grow{0%{transform:scaleY(0)}40%,100%{transform:scaleY(1)}}
.a-blink{animation:blink 3.2s infinite}
.a-look{animation:look 4s infinite}
.a-cursor{animation:cursor 1.1s steps(1) infinite}
.a-nod{animation:nod 2.2s infinite}
.a-hop{animation:hop 1.8s infinite}
.a-slide{animation:slide 3s ease-in-out infinite}
.a-b1{animation:bar1 2.4s infinite}.a-b2{animation:bar2 2.4s infinite}.a-b3{animation:bar3 2.4s infinite}
.a-wink{animation:wink 3s infinite}.a-winkp{animation:winkplus 3s infinite}
.a-pop{animation:pop 2.4s infinite}
.a-glow{animation:glow 2.6s ease-in-out infinite}
.a-squash{animation:squash 3s infinite}
.a-grow{animation:grow 3s ease-out infinite;transform-origin:bottom}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<h1>Lowie · 10 identités</h1>
<p class="lead">Une couleur (encre) + un accent lavande. Chaque concept est montré animé, en logo de nav et en favicon 16 px. Rien n'est repris d'une mascotte existante.</p>
<div class="grid" id="grid"></div>

<template id="t1"><!-- 1 Paupière -->
<svg viewBox="0 0 16 16"><rect x="4" y="2" width="8" height="12" fill="#121212"/><g class="a-blink"><rect x="6" y="5" width="1" height="3" fill="#fff"/><rect x="9" y="5" width="1" height="3" fill="#fff"/></g></svg></template>

<template id="t2"><!-- 2 Prompt >_ -->
<svg viewBox="0 0 16 16"><g class="a-nod" fill="#121212"><rect x="1" y="3" width="2" height="2"/><rect x="3" y="5" width="2" height="2"/><rect x="5" y="7" width="2" height="2"/><rect x="3" y="9" width="2" height="2"/><rect x="1" y="11" width="2" height="2"/></g><rect x="9" y="5" width="2" height="2" fill="#C4B5FD"/><rect x="12" y="5" width="2" height="2" fill="#C4B5FD"/><rect class="a-cursor" x="8" y="11" width="7" height="2" fill="#121212"/></svg></template>

<template id="t3"><!-- 3 Accolades -->
<svg viewBox="0 0 16 16"><g class="a-squash" fill="#121212"><rect x="3" y="2" width="2" height="1"/><rect x="2" y="3" width="1" height="4"/><rect x="1" y="7" width="1" height="2"/><rect x="2" y="9" width="1" height="4"/><rect x="3" y="13" width="2" height="1"/><rect x="11" y="2" width="2" height="1"/><rect x="13" y="3" width="1" height="4"/><rect x="14" y="7" width="1" height="2"/><rect x="13" y="9" width="1" height="4"/><rect x="11" y="13" width="2" height="1"/></g><g class="a-look" fill="#121212"><rect x="5" y="6" width="2" height="3"/><rect x="9" y="6" width="2" height="3"/></g></svg></template>

<template id="t4"><!-- 4 Nœud de commit -->
<svg viewBox="0 0 16 16"><rect x="7" y="0" width="2" height="16" fill="#C4B5FD"/><rect class="a-grow" x="11" y="1" width="2" height="5" fill="#C4B5FD"/><rect x="9" y="5" width="3" height="1" fill="#C4B5FD"/><g class="a-slide"><rect x="4" y="5" width="8" height="6" fill="#121212"/><rect x="3" y="6" width="10" height="4" fill="#121212"/><rect x="6" y="7" width="1" height="2" fill="#fff"/><rect x="9" y="7" width="1" height="2" fill="#fff"/></g></svg></template>

<template id="t5"><!-- 5 Antennes signal -->
<svg viewBox="0 0 16 16"><rect class="a-b1" x="4" y="4" width="1" height="2" fill="#121212"/><rect class="a-b2" x="7" y="2" width="1" height="4" fill="#121212"/><rect class="a-b3" x="10" y="0" width="1" height="6" fill="#121212"/><rect x="3" y="6" width="10" height="9" fill="#121212"/><rect x="2" y="7" width="12" height="7" fill="#121212"/><g class="a-blink"><rect x="5" y="9" width="2" height="2" fill="#fff"/><rect x="9" y="9" width="2" height="2" fill="#fff"/></g></svg></template>

<template id="t6"><!-- 6 Monogramme L -->
<svg viewBox="0 0 16 16"><rect x="3" y="1" width="4" height="10" fill="#121212"/><rect x="5" y="3" width="1" height="2" fill="#fff"/><rect class="a-cursor" x="3" y="12" width="10" height="3" fill="#121212"/></svg></template>

<template id="t7"><!-- 7 Chevron éclaireur -->
<svg viewBox="0 0 16 16"><g class="a-hop"><g fill="#121212"><rect x="2" y="1" width="3" height="2"/><rect x="4" y="3" width="3" height="2"/><rect x="6" y="5" width="3" height="2"/><rect x="8" y="6" width="5" height="4"/><rect x="6" y="9" width="3" height="2"/><rect x="4" y="11" width="3" height="2"/><rect x="2" y="13" width="3" height="2"/></g><rect class="a-blink" x="10" y="7" width="2" height="2" fill="#fff"/></g></svg></template>

<template id="t8"><!-- 8 Clin d'œil diff -->
<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" fill="#121212"/><rect x="3" y="2" width="10" height="12" fill="#121212"/><g fill="#C4B5FD"><rect x="4" y="7" width="3" height="1"/><rect x="5" y="6" width="1" height="3"/></g><rect class="a-wink" x="9" y="7" width="3" height="1" fill="#fff"/><g class="a-winkp" fill="#C4B5FD"><rect x="9" y="7" width="3" height="1"/><rect x="10" y="6" width="1" height="3"/></g></svg></template>

<template id="t9"><!-- 9 Le +1 -->
<svg viewBox="0 0 16 16"><g fill="#121212"><rect x="5" y="2" width="5" height="12"/><rect x="1" y="6" width="13" height="4"/></g><rect x="6" y="7" width="1" height="2" fill="#fff"/><rect x="8" y="7" width="1" height="2" fill="#fff"/><g class="a-pop" fill="#C4B5FD"><rect x="12" y="0" width="1" height="1"/><rect x="11" y="1" width="3" height="1"/><rect x="12" y="2" width="1" height="1"/><rect x="15" y="0" width="1" height="3"/></g></svg></template>

<template id="t10"><!-- 10 Lanterne -->
<svg viewBox="0 0 16 16"><rect x="6" y="0" width="4" height="1" fill="#121212"/><rect x="5" y="1" width="1" height="2" fill="#121212"/><rect x="10" y="1" width="1" height="2" fill="#121212"/><rect x="3" y="3" width="10" height="2" fill="#121212"/><rect x="3" y="5" width="2" height="8" fill="#121212"/><rect x="11" y="5" width="2" height="8" fill="#121212"/><rect class="a-glow" x="5" y="5" width="6" height="8" fill="#C4B5FD"/><rect x="7" y="8" width="1" height="2" fill="#121212"/><rect x="9" y="8" width="1" height="2" fill="#121212"/><rect x="3" y="13" width="10" height="2" fill="#121212"/></svg></template>

<script>
const D = [
 ["Le curseur-paupière","Le curseur du terminal cligne. Ici, chaque clignement est un clignement d'yeux.","Animation : il cligne au rythme d'un vrai curseur, regarde ailleurs quand il cherche.","Proche de la v1 jugée nulle : la silhouette (un rectangle) n'appartient à personne."],
 ["Le prompt qui parle","Le « >_ » du terminal devient un visage : le chevron est la bouche, le trait le curseur.","Animation : le chevron « parle » (avance d'un pixel), le trait clignote.","« >_ » est l'icône générique de tout terminal : très lisible, peu à nous."],
 ["Les accolades { •• }","Deux accolades de code encadrent deux yeux : le code qui prend la parole.","Animation : les yeux regardent à gauche, à droite ; les accolades respirent.","Fort à 16 px. Risque : ressemble à un emoji « {•_•} » déjà vu."],
 ["Le nœud de commit","Un point du graphe git, avec des yeux, qui monte le long de la branche.","Animation : il glisse sur la ligne, une branche pousse quand un post part.","Très parlant pour un dev, moins pour un fondateur non-dev."],
 ["Les antennes-signal","Un petit corps dont les antennes sont trois barres de signal.","Animation : les barres se remplissent quand un post rapporte des inscrits.","Le concept « Lo » de character.md. Les mascottes « blob » sont nombreuses."],
 ["Le monogramme L","Un L fait d'un curseur ▌ et d'un trait _ : l'initiale ET le terminal.","Animation : le trait du bas clignote comme un curseur.","Le plus sobre : un logo plus qu'un personnage, moins attachant."],
 ["Le chevron éclaireur","Le « › » de l'art ASCII du hero, avec un œil à la pointe : il part devant.","Animation : il sautille vers l'avant, cligne de l'œil.","Relie le logo au hero existant. Abstrait : un œil seul suffit-il ?"],
 ["Le clin d'œil diff","Un œil « + », un œil « − » : un diff git qui fait un clin d'œil.","Animation : le « − » devient « + » quand un inscrit arrive.","Le plus original des 10. Les signes doivent rester lisibles à 16 px."],
 ["Le +1","Un « + » avec des yeux : Lowie compte, chaque inscrit est un +1.","Animation : un petit « +1 » s'envole à chaque inscription.","Le « + » rappelle la croix suisse, la santé, les pharmacies."],
 ["La lanterne","Une lanterne qui part devant dans le noir du marché ; la lumière = le résultat.","Animation : la lumière pulse plus fort quand le marché répond.","Le concept 2 de character.md. Plus « illustration », moins « terminal »."]
];
const grid = document.getElementById("grid");
D.forEach(([name, idea, anim, risk], i) => {
  const t = document.getElementById("t" + (i+1)).content.querySelector("svg");
  const big = t.cloneNode(true); big.setAttribute("width","112"); big.setAttribute("height","112");
  const nav = t.cloneNode(true); nav.setAttribute("width","24"); nav.setAttribute("height","24");
  const fav = t.cloneNode(true); fav.setAttribute("width","16"); fav.setAttribute("height","16");
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = `<div class="n">${String(i+1).padStart(2,"0")}</div><div class="stage"></div><div class="sizes"><span class="wm"></span><span class="fv"></span><span>16 px</span></div><h2>${name}</h2><p>${idea}</p><p><b>${anim}</b></p><p class="risk">⚠ ${risk}</p>`;
  card.querySelector(".stage").append(big);
  const wm = card.querySelector(".wm"); wm.append(nav); wm.append("Lowie");
  card.querySelector(".fv").append(fav);
  grid.append(card);
});
</script>
</body></html>
