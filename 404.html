<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Lowie</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root { --ink:#121212; --muted:#6B6B6B; --line:#EEEEEE; --term:#161616; --term-text:#EDEDED; --term-dim:#9A9A9A; --term-accent:#C4B5FD; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:#fff; color:var(--ink); font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  ::selection { background:#EAE4FF; color:var(--ink); }
  header { padding:24px 48px; border-bottom:1px solid var(--line); }
  header a { font-family:Silkscreen, monospace; font-size:22px; line-height:1; color:var(--ink); text-decoration:none; letter-spacing:.02em; display:inline-flex; }
  header .wm { display:flex; align-items:center; }
  header svg { margin:0 3px; position:relative; top:2px; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:64px 24px; text-align:center; }
  #face { display:block; }
  h1 { font-family:Silkscreen, monospace; font-weight:400; font-size:40px; line-height:46px; text-wrap:balance; }
  .term { width:520px; max-width:100%; background:var(--term); border-radius:9px; padding:18px 22px; font-family:"IBM Plex Mono", monospace; font-size:14px; line-height:22px; color:var(--term-text); text-align:left; display:flex; flex-direction:column; gap:6px; }
  .dim { color:var(--term-dim); } .acc { color:var(--term-accent); }
  a.home { display:inline-flex; align-items:center; height:48px; padding:0 22px; border-radius:4px; background:var(--ink); color:#fff; text-decoration:none; font-family:"IBM Plex Mono", monospace; font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  a.home:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  @media (max-width:640px) { header { padding:16px; } h1 { font-size:28px; line-height:34px; } }
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header><a href="/" aria-label="Lowie"><span class="wm" aria-hidden="true">L<svg id="mk" width="25" height="20" viewBox="0 0 20 16" shape-rendering="crispEdges"></svg>WIE</span></a></header>
<main>
  <svg id="face" width="150" height="120" viewBox="0 0 20 16" shape-rendering="crispEdges" aria-hidden="true"></svg>
  <h1>404. Not in the repo.</h1>
  <div class="term" aria-label="Terminal">
    <div><span class="dim">$</span> cd <span id="path">/this-page</span></div>
    <div class="acc">no such file or directory</div>
    <div><span class="dim">$</span> cd /</div>
  </div>
  <a class="home" href="/">Back to Lowie</a>
</main>
<script>
  const r = (x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#121212"/>`;
  const LB = [[4,1,2,1],[3,2,2,4],[2,6,2,1],[1,7,2,2],[2,9,2,1],[3,10,2,4],[4,14,2,1]];
  const braces = LB.map(([x,y,w,h])=>r(x,y,w,h)).join("") + LB.map(([x,y,w,h])=>r(20-x-w,y,w,h)).join("");
  // { ?? } : two pixel question marks
  const q = x => r(x,5,3,1)+r(x+2,6,1,1)+r(x+1,7,1,1)+r(x+1,9,1,1);
  const look = dx => r(7+dx,6,2,3)+r(11+dx,6,2,3);
  const face = document.getElementById("face");
  const frames = [q(6)+q(11), look(-1), look(1), q(6)+q(11)];
  let i = 0; face.innerHTML = braces + frames[0];
  document.getElementById("mk").innerHTML = braces + look(0);
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
    setInterval(() => { i = (i + 1) % frames.length; face.innerHTML = braces + frames[i]; }, 900);
  try { const p = decodeURIComponent(location.pathname); if (p && p !== "/404" && p !== "/404.html") document.getElementById("path").textContent = p.slice(0, 40); } catch {}
</script>
</body>
</html>
